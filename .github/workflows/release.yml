# On a version tag (v1.2.3): check that the tag matches package.json's version, run the checks, then create the
# GitHub release. omp installs plugins from git, so the tag itself is the publication; nothing goes to a registry.
# Re-running the workflow for a tag that already has a release fails at `gh release create` instead of replacing it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          test "$TAG" = "v$version" || { echo "tag $TAG does not match package.json version $version"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run check

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
