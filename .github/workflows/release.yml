# On a version tag (vX.Y.Z), pushed by `just release-publish`: check that the tag names a commit on main whose
# version files and changelog match it, run the checks, publish the npm package @nledford/omp-coord to GitHub
# Packages, then create the GitHub release with the changelog entry as its notes. A GitHub release therefore always
# has its package. Re-running is safe: a version already in GitHub Packages is not published again (published
# versions cannot be replaced), and `gh release create` fails rather than replace an existing release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tagged commit is not on main"; exit 1; }
      - name: Tag matches the version files and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release.ts verify "$TAG"
      - run: bun install --frozen-lockfile
      - run: bun run check

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish to GitHub Packages, unless this version is there already
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          published=$(gh api --paginate "/users/$GITHUB_REPOSITORY_OWNER/packages/npm/omp-coord/versions" --jq '.[].name' 2>/dev/null) || published=""
          if grep -qxF "$version" <<<"$published"; then
            echo "@nledford/omp-coord@$version is already published"
            exit 0
          fi
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          npm publish --userconfig "$RUNNER_TEMP/.npmrc"
          # The registry serves what was just published (publishConfig applies to publish only, so name the registry).
          test "$(npm view "@nledford/omp-coord@$version" version --registry https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/.npmrc")" = "$version"

  release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bun scripts/release.ts notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
