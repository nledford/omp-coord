# On a version tag (vX.Y.Z or vX.Y.Z-pre), pushed by `just release-publish`: check that the tag names a commit on
# main whose version files and changelog match it, run the checks, then create the GitHub release with the changelog
# entry as its notes. omp installs plugins from git, so the tag itself is the publication; nothing goes to a registry.
# Re-running the workflow for a tag that already has a release fails at `gh release create` instead of replacing it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tagged commit is not on main"; exit 1; }
      - name: Tag matches the version files and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release.ts verify "$TAG"
      - run: bun install --frozen-lockfile
      - run: bun run check

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bun scripts/release.ts notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
