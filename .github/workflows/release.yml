# On a version tag (vX.Y.Z), pushed by `just release-publish`: check that the tag names a commit on main whose
# version files and changelog match it, run the checks, publish the npm package @nledford/omp-coord to npmjs.com
# (trusted publishing: no stored token, provenance attached) and to GitHub Packages, then create the GitHub release
# with the changelog entry as its notes. A GitHub release therefore always has both packages. Re-running is safe: a
# version already in a registry is not published again (published versions cannot be replaced), and a GitHub release
# that exists already is left as it is.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release run per tag at a time. GitHub once delivered the v0.2.2 tag push twice in the same second: both runs got
# past "unless this version is there already" before either published, and the second failed on npm's 409. Queued
# (not canceled), the second run finds the version published and the release there, and skips both.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tagged commit is not on main"; exit 1; }
      - name: Tag matches the version files and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release.ts verify "$TAG"
      - run: bun install --frozen-lockfile
      - run: bun run check

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # trusted publishing: npm exchanges the job's OIDC token for a one-time publish token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Publish to npmjs.com, unless this version is there already
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          version="${TAG#v}"
          registry=https://registry.npmjs.org
          node -e 'const v = process.argv[1], [a, b, c] = v.split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("npm " + v + " is older than 11.5.1, which trusted publishing needs"); process.exit(1); }' "$(npm --version)"
          if [ "$(npm view "@nledford/omp-coord@$version" version --registry "$registry" 2>/dev/null)" = "$version" ]; then
            echo "@nledford/omp-coord@$version is already on npmjs.com"
            exit 0
          fi
          # A version npm already holds, even one still being processed, is refused as a conflict. A conflict counts as
          # success only once the registry shows this exact version (npm may take minutes to list it); otherwise fail.
          if ! npm publish --access public --registry "$registry" 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            if grep -qE "EPUBLISHCONFLICT|cannot publish over the previously published versions|E409|already exists in live registry" "$RUNNER_TEMP/publish.log"; then
              for _ in $(seq 40); do
                if [ "$(npm view "@nledford/omp-coord@$version" version --registry "$registry" 2>/dev/null)" = "$version" ]; then
                  echo "npm already holds @nledford/omp-coord@$version"
                  exit 0
                fi
                sleep 15
              done
              echo "npm refused the publish as a conflict, but @nledford/omp-coord@$version did not appear within 10 minutes" >&2
            fi
            exit 1
          fi
          # npm processes a new version for some minutes before serving it, and lists it before its tarball downloads;
          # a successful publish is authoritative, so this waits up to 15 minutes and then only warns.
          for _ in $(seq 90); do
            tarball=$(npm view "@nledford/omp-coord@$version" dist.tarball --registry "$registry" 2>/dev/null) || tarball=""
            [ -n "$tarball" ] && curl -sfI "$tarball" >/dev/null && exit 0
            sleep 10
          done
          echo "::warning::npm accepted @nledford/omp-coord@$version but did not serve it within 15 minutes; check https://www.npmjs.com/package/@nledford/omp-coord"

  publish-github:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish to GitHub Packages, unless this version is there already
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          registry=https://npm.pkg.github.com
          published=$(gh api --paginate "/users/$GITHUB_REPOSITORY_OWNER/packages/npm/omp-coord/versions" --jq '.[].name' 2>/dev/null) || published=""
          if grep -qxF "$version" <<<"$published"; then
            echo "@nledford/omp-coord@$version is already published"
            exit 0
          fi
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          npm publish --registry "$registry" --userconfig "$RUNNER_TEMP/.npmrc"
          test "$(npm view "@nledford/omp-coord@$version" version --registry "$registry" --userconfig "$RUNNER_TEMP/.npmrc")" = "$version"

  release:
    needs: [check, publish-npm, publish-github]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists already"
            exit 0
          fi
          bun scripts/release.ts notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
